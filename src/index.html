<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Az Todo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link rel="stylesheet" href="./stylesheets/main.css" />
</head>

<body>
  <main>
    <!-- stats -->
    <section id="statsBanner" class="container">
      <div class="row">
        <p class="col-4">High</p>
        <p class="col-4">Medium</p>
        <p class="col-4">Low</p>
      </div>
    </section>

    <hr />

    <!-- task form -->
    <section id="taskInputWrapper" class="container">
      <form id="taskForm">
        <div class="d-flex">
          <input name="taskName" id="taskName" type="text" class="form-control" placeholder="Task name" />

          <select class="form-control" name="taskPriority" id="taskPriority">
            <option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option>
            <option value="LOW">Low</option>
          </select>

          <button id="taskSubmitBtn" class="btn btn-primary">Add</button>
        </div>
      </form>
    </section>

    <!-- task list container -->
    <section id="listContainer" class="container mt-2">
      <div class="card">
        <div class="card-header">
          Todo items
        </div>

        <div class="card-body">
          <!-- task list -->
          <ul id="taskList" class="list-group list-group">
            <!-- task item -->
          </ul>
        </div>

      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>


  <script src="./scripts/task.constants.js"></script>
  <script src="./scripts/utils.js"></script>
  <script src="./scripts/todo.service.js"></script>
  <script src="./scripts/todo-form.component.js"></script>
  <script src="./scripts/todo-list-item.component.js"></script>
  <script src="./scripts/todo-list.component.js"></script>
  <script src="./scripts/main.js"></script>
</body>

</html>
